<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Подача резюме</title>
  <style>
    *{font-family: "Times New Romans"; font-size: 20px}
    p{text-indent: 30px}
    h1{text-align: center; font-size: 30px}
    td{vertical-align: top}
  </style>
</head>
<body>
<p>ООО "Русский дар" <img src="logo.jpg" height="70" width="70"></p>
<h1>Подача резюме.</h1>
<form action="mailto: nugumanov.timur.51207@gmail.com" method="post">
  <table>
    <tr>
      <td>Полное ФИО</td><td><input type="text" name="FIO" id="FIO" size="40"></td>
    </tr>
    <tr>
      <td>Дата рождения</td><td><input type="date" name="birthday" id="birthday" size="40"></td>
    </tr>
     <tr>
      <td>Семейное положение</td><td><input type="text" name="FS" id="FS" size="40"></td>
    </tr>
    <tr>
      <td>Адрес проживания</td><td><input type="text" name="adres" id="adres" size="40"></td>
    </tr>
    <tr>
      <td>Ваша цель в компании</td><td><input type="text" name="tsel" id="tsel" size="40"></td>
    </tr>
     <tr>
      <td>Телефон</td><td><input type="text" name="phone" id="phone" size="40" value="+7"></td>
    </tr>
    <tr>
      <td>Электронная почта</td><td><input type="text" name="email" id="email" size="40"></td>
    </tr>
    <tr>
      <td>Образование</td><td><textarea name="obrazovanie" id="obrazovanie" rows="7" cols="70" style="font-size: 15px"></textarea></td>
    </tr>
    <tr>
      <td>Опыт работы</td><td><textarea name="opit" id="opit" rows="7" cols="70" style="font-size: 15px"></textarea></td>
    </tr>
    <tr>
      <td>Полезные навыки</td><td><textarea name="skill" id="skill" rows="7" cols="70" style="font-size: 15px"></textarea></td>
    </tr>
    <tr>
      <td>Личные качества</td><td><textarea name="lichnie kachestva" id="lichnie kachestva" rows="7" cols="70" style="font-size: 15px"></textarea></td>
    </tr>
    <tr>
      <td>Фото лица</td><td><input type="file" name="photo" id="photo"></td>
    </tr>
  </table>
</form>
<p><a href="index.html">Вернутся на главную страницу</a></p>
</body>
</html>
